name: 更新 texts 清单

# 往 texts/ 里加或改文本后，自动重新生成 texts/index.json，
# 这样部署在 GitHub Pages 上的页面就能立刻发现新文件。

on:
  push:
    branches: [main, master]
    paths:
      - 'texts/**'
      - 'build.py'
      - 'template.html'
  workflow_dispatch:        # 也可以在 Actions 页面手动点一次

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 重新生成 index.html 与 texts/index.json
        run: python build.py

      - name: 提交变化
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/index.json index.html
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新 texts 清单 [skip ci]"
            git push
          fi
